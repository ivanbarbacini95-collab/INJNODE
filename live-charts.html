<body>
  <main class="live-page" id="livePage">
    <header class="terminal-header">
      <button class="icon-button back-button" id="liveChartsBack" type="button" aria-label="Torna alla Home">×</button>

      <div class="brand inj-location-brand" data-i18n-skip="true" aria-label="Live Charts">
        <span class="inj-location-section">LIVE CHARTS</span>
      </div>

      <div class="market-heading">
        <div class="market-pair"><i></i><strong>INJ / USDT</strong><span id="activeRangeLabel">1 MIN</span></div>
        <div class="market-price-row">
          <strong id="headerLivePrice">—</strong>
          <span class="range-change neutral" id="headerRangeChange">—</span>
        </div>
      </div>

      <div class="header-actions">
        <span class="connection-pill" id="connectionState"><i></i><b>CONNECTING</b></span>
        <button class="focus-button indicator-toggle" id="indicatorToggle" type="button" aria-pressed="true">IND</button>
        <button class="focus-button" id="focusToggle" type="button" aria-pressed="false">FOCUS</button>
      </div>
    </header>

    <nav class="timeframe-bar" id="timeframeBar" aria-label="Seleziona timeframe">
      <button class="timeframe active" type="button" data-range="m1" aria-label="1 minuto" aria-pressed="true">1m</button>
      <button class="timeframe" type="button" data-range="m5" aria-label="5 minuti" aria-pressed="false">5m</button>
      <button class="timeframe" type="button" data-range="m10" aria-label="10 minuti" aria-pressed="false">10m</button>
      <button class="timeframe" type="button" data-range="h1" aria-label="1 ora" aria-pressed="false">1H</button>
      <button class="timeframe" type="button" data-range="h3" aria-label="3 ore" aria-pressed="false">3H</button>
      <button class="timeframe" type="button" data-range="h6" aria-label="6 ore" aria-pressed="false">6H</button>
      <button class="timeframe" type="button" data-range="h12" aria-label="12 ore" aria-pressed="false">12H</button>
      <button class="timeframe" type="button" data-range="d1" aria-label="1 giorno" aria-pressed="false">1G</button>
      <button class="timeframe" type="button" data-range="d3" aria-label="3 giorni" aria-pressed="false">3G</button>
      <button class="timeframe" type="button" data-range="w1" aria-label="1 settimana" aria-pressed="false">1S</button>
      <button class="timeframe" type="button" data-range="mo1" aria-label="1 mese" aria-pressed="false">1M</button>
      <button class="timeframe" type="button" data-range="y1" aria-label="1 anno" aria-pressed="false">1Y</button>
      <button class="timeframe" type="button" data-range="all" aria-label="Storico INJ dal 21 ottobre 2020" aria-pressed="false">TUTTO</button>
    </nav>

    <section class="terminal-shell" id="terminalShell" data-range-key="m1" aria-label="Grafico realtime Injective">
      <div class="chart-stage">
        <div class="chart-column">
          <div class="plot" id="plot">
            <canvas id="mainCanvas" aria-label="Grafico Live INJ USDT"></canvas>
            <span class="chart-history-caption" id="historyViewing" hidden>STORICO · DATI LIVE ATTIVI</span>
            <button id="returnToLive" class="chart-return-live" type="button" hidden aria-label="Torna al grafico in tempo reale"><i></i> TORNA A LIVE <span>↗</span></button>
            <div class="loading" id="chartLoading"><i></i><span>SYNC</span></div>
            <div class="chart-watermark" aria-hidden="true"><span>INJ</span><small id="watermarkRange">1 MIN</small></div>
            <div class="ema-legend" aria-hidden="true"><span class="ema12">EMA 12</span><span class="ema26">EMA 26</span><span class="ema50">EMA 50</span><span class="ema200">EMA 200</span></div>
          </div>
          <section class="indicator-panel rsi-panel" id="rsiPanel" aria-label="RSI 14">
            <div class="indicator-head"><span>RSI 14</span><strong id="rsiValue">—</strong></div>
            <canvas id="rsiCanvas"></canvas>
          </section>
          <section class="indicator-panel macd-panel" id="macdPanel" aria-label="MACD 12 26 9">
            <div class="indicator-head"><span>MACD 12 · 26 · 9</span><strong id="macdValue">—</strong></div>
            <canvas id="macdCanvas"></canvas>
          </section>
        </div>
        <div class="scale-column">
          <aside class="price-scale" id="priceScale" aria-label="Scala prezzo">
            <span class="scale-top" id="scaleTop">—</span><span class="scale-q3" id="scaleQ3">—</span><span class="scale-mid" id="scaleMid">—</span><span class="scale-q1" id="scaleQ1">—</span><span class="scale-bottom" id="scaleBottom">—</span>
            <div class="scale-marker" id="scaleMarker"><i></i><strong id="scaleLive">—</strong></div>
          </aside>
          <aside class="indicator-scale rsi-scale" aria-hidden="true"><span>70</span><span>50</span><span>30</span></aside>
          <aside class="indicator-scale macd-scale" aria-hidden="true"><span>+</span><span>0</span><span>−</span></aside>
        </div>
      </div>

      <div class="market-strip" id="marketStrip">
        <div><span>OPEN</span><strong id="statOpen">—</strong></div>
        <div><span>HIGH</span><strong id="statHigh">—</strong></div>
        <div><span>LOW</span><strong id="statLow">—</strong></div>
        <div><span>CHANGE</span><strong class="neutral" id="statChange">—</strong></div>
        <div class="last-update"><span>LAST TICK</span><strong id="lastTickText">—</strong></div>
      </div>
    </section>

    <footer class="live-footer">
      <small><b id="footerRange">1 MIN</b> · CANDLE LIVE</small>
      <span class="inj-brand-credit" data-i18n-skip="true" aria-label="INJ Node by B Capital Group"><strong>INJ Node</strong><span>by B Capital Group</span></span>
    </footer>
  </main>
  <script src="live-charts.js?v=20261026tf1" defer></script>
<script defer src="./chart-haptics.js?v=160720"></script>


</body>
</html>
