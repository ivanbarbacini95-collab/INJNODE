 ['all','Tutte','All'],['deposit','Deposit','Deposits'],['withdraw','Withdraw','Withdrawals'],['reward','Reward riscossi','Claimed rewards'],['staking','INJ in staking','Staked INJ']
];

 ['7d','7 giorni','7 days',7],['30d','30 giorni','30 days',30],

function short(s){s=String(s||'');return s.length>20?s.slice(0,10)+'…'+s.slice(-6):s;}
function normalizedTimestamp(value){
 if(value===null||value===undefined||value==='')return '';
 if(typeof value==='object'&&value.seconds!==undefined){
  var seconds=Number(value.seconds),ns=Number(value.nanos||0);
  return Number.isFinite(seconds)?new Date(seconds*1000+ns/1e6).toISOString():'';
 }
 var input=String(value).trim();
 if(/^\d+(?:\.\d+)?$/.test(input)){
  var n=Number(input);
  if(!Number.isFinite(n))return '';
  // Explorer deployments can expose seconds, milliseconds, microseconds or nanoseconds.
  if(n>=1e17)n/=1e6;
  else if(n>=1e14)n/=1e3;
  else if(n<1e11)n*=1000;
  if(n<946684800000||n>Date.now()+86400000)return '';
  var parsed=new Date(n);
  return Number.isNaN(parsed.valueOf())?'':parsed.toISOString();
 }
 var valueDate=new Date(input);
 return Number.isNaN(valueDate.valueOf())?'':valueDate.toISOString();
}
function firstTimestamp(){
 for(var i=0;i<arguments.length;i++){
  var formatted=normalizedTimestamp(arguments[i]);
  if(formatted)return formatted;
 }
 return '';
}
function decodeMaybeBase64(value){
 if(typeof value!=='string'||!value||!(/^[a-zA-Z0-9+/]+={0,2}$/.test(value))||value.length%4!==0)return value;
 try{
  var text=atob(value);

}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function readSaved(){

 try{values=JSON.parse(localStorage.getItem('inj_monitor_wallets_v1')||'[]');}catch(_){}
 if(!Array.isArray(values))values=[];
 var legacy='';
 try{legacy=localStorage.getItem('inj_monitor_address')||'';}catch(_){}
 if(addressPattern.test(legacy)&&!values.some(function(v){return String(v.address||'').toLowerCase()===legacy.toLowerCase();}))
  values.push({address:legacy,label:lang('Wallet attivo','Active wallet')});
 values.push({address:'inj1nj4ahf4p96ulu7r7n3h27u4rlud5qlc2jy3zyg',label:'Injective · Cash Reserve'});
 var unique=new Set();
 return values.map(function(v,i){
  var address=String(v.address||'').trim();
  if(addressPattern.test(address))address=address.toLowerCase();
  return {address:address,label:String(v.label||'Wallet '+(i+1)).slice(0,36)};
 }).filter(function(v){if(!addressPattern.test(v.address)||unique.has(v.address))return false;unique.add(v.address);return true;});

 select.disabled=false;
 saved.forEach(function(v){var o=document.createElement('option');o.value=v.address;o.textContent=v.label+' · Injective';select.add(o);});
 var active='';
 try{active=sessionStorage.getItem('inj_all_transaction_selected')||localStorage.getItem('inj_monitor_address')||'';}catch(_){}
 current=saved.some(function(v){return v.address===active;})?active:saved[0].address;

}

 cancelled();generation++;busy=false;hydrating=false;hydratedHashKeys.clear();hydrationFailures.clear();SOURCES=['indexer'];

 retrieve(false);

}
async function queryFullInjectiveTx(item){
 var full='';
 for(var i=0;i<2;i++){
  try {
   var data=await requestJSON(ENDPOINTS[i]+'/cosmos/tx/v1beta1/txs/'+encodeURIComponent(item.hash),6500);
   var response=data.tx_response||data.txResponse||{};
   response.txhash=response.txhash||item.hash;
   var parsed=normalize(data.tx||{},response,current);
   if(parsed){full=parsed;break;}
  }catch(_){}
 }
 if(!full)full={};
 if(!firstTimestamp(full.time,item.time)&&item.height){
  var time=await blockTimeFromHeight(item.height);
  if(time)full.time=time;
 }
 return full;
}
function needsHydration(item){
 return item&&(!firstTimestamp(item.time)||!Array.isArray(item.actions)||!item.actions.length||
   item.actions.some(function(action){return !/^\d+$/.test(String(action.atoms||''));}));
}
async function enrichInjectiveRows(run){
 if(hydrating)return;
 var incomplete=rows.filter(function(item){return needsHydration(item)&&!hydratedHashKeys.has(item.hash)&&!hydrationFailures.has(item.hash);}).slice(0,45);
 if(!incomplete.length)return;
 hydrating=true;
 var cursor=0,updates=0;
 async function worker(){
  while(cursor<incomplete.length&&run===generation){
   var original=incomplete[cursor++];
   if(!original)break;
   try{
    var details=await queryFullInjectiveTx(original);
    if(run!==generation)break;
    var idx=rows.findIndex(function(x){return x.hash===original.hash;});
    if(idx>=0){
     rows[idx]=mergeIndexedDetails(rows[idx],details);
     if(!needsHydration(rows[idx]))hydratedHashKeys.add(original.hash);
     else hydrationFailures.add(original.hash);
     updates++;
     if(updates%4===0){cacheWrite();render();}
    }
   }catch(_){hydrationFailures.add(original.hash);}
  }
 }
 await Promise.all([worker(),worker(),worker()]);
 if(run===generation&&updates){rows.sort(function(a,b){
  var dateDelta=Date.parse(b.time||'')-Date.parse(a.time||'');
  return Number.isFinite(dateDelta)&&dateDelta!==0?dateDelta:Number(b.height||0)-Number(a.height||0);
 });cacheWrite();render();}
 if(run===generation){
  var partial=rows.some(needsHydration);
  stateText(partial?'partial':'ok',partial?lang('Dettagli parziali','Partial details'):lang('On-chain · aggiornato','On-chain · updated'));
 }
 hydrating=false;
}
async function retrieve(more){
 if(!current){rows=[];canLoad=false;stateText('idle',lang('Nessun wallet','No wallet'));render();return;}
 if(busy)return;
 var run=++generation;
 if(!more){
  cancelled();hydrating=false;rows=[];offsetBySource={};doneBySource={};canLoad=true;
  var fromCache=cacheRead(current);
  if(fromCache.length){rows=fromCache;stateText('partial',lang('Storico salvato · sincronizzazione','Cached history · syncing'));}
 }else{cancelled();}
 busy=true;
 stateText('partial',lang('Sincronizzazione...','Syncing...'));render();
 var sources=SOURCES.filter(function(source){return !doneBySource[source];});
 var results=await Promise.allSettled(sources.map(function(source){return querySource(source,(offsetBySource[source]||0)+1);}));
 if(run!==generation)return;
 var succeeded=0,failed=0,fresh=[];
 results.forEach(function(result,index){
  var source=sources[index];
  if(result.status==='fulfilled'){
   succeeded++;
   offsetBySource[source]=(offsetBySource[source]||0)+1;
   doneBySource[source]=result.value.done;
   fresh=fresh.concat(result.value.items);
  }else{
   failed++;
   if(result.reason&&result.reason.name==='AbortError')return;
  }
 });
 if(!succeeded&&sources.includes('indexer')){
  SOURCES=LCD_SOURCES.slice();offsetBySource={};doneBySource={};busy=false;
  stateText('partial',lang('Verifica sorgente alternativa...','Trying alternate source...'));
  return retrieve(false);
 }
 if(succeeded){
  var seen=new Map();
  rows.concat(fresh).forEach(function(item){
    if(!item||!item.hash)return;
    seen.set(item.hash,seen.has(item.hash)?mergeIndexedDetails(seen.get(item.hash),item):item);
   });
  rows=Array.from(seen.values()).sort(function(a,b){var d=Date.parse(b.time||'')-Date.parse(a.time||'');return isFinite(d)&&d!==0?d:Number(b.height||0)-Number(a.height||0);});
  cacheWrite();
  var incomplete=rows.some(needsHydration);
  stateText(failed||incomplete?'partial':'ok',failed?lang('Risultati parziali','Partial results'):incomplete?lang('Recupero dettagli...','Loading details...'):lang('On-chain · aggiornato','On-chain · updated'));
 }else{
  stateText('error',rows.length?lang('Offline · dati salvati','Offline · cached data'):lang('Fonte non raggiungibile','Source unavailable'));
 }
 canLoad=sources.some(function(s){return !doneBySource[s];});
 busy=false;render();
 if(succeeded)void enrichInjectiveRows(run);
}
function start(){
 initializeTranslations();renderFilters();renderPeriods();loadWallets();
 if(current)changeWallet(current);else{canLoad=false;stateText('idle',lang('Nessun wallet salvato','No saved wallet'));render();}
 $('atWallet').addEventListener('change',function(){changeWallet(this.value);});
 $('atSearch').addEventListener('input',function(){visibleCount=VISIBLE_STEP;render();});
 $('atFrom').addEventListener('change',function(){period='custom';visibleCount=VISIBLE_STEP;renderPeriods();render();});
 $('atTo').addEventListener('change',function(){period='custom';visibleCount=VISIBLE_STEP;renderPeriods();render();});
 $('atClearDates').addEventListener('click',function(){$('atFrom').value='';$('atTo').value='';period='all';visibleCount=VISIBLE_STEP;renderPeriods();render();});
 $('atMore').addEventListener('click',function(){if(busy)return;visibleCount+=VISIBLE_STEP;if(matchingCount<visibleCount&&canLoad)retrieve(true);else render();});
 $('atRefresh').addEventListener('click',function(){visibleCount=VISIBLE_STEP;SOURCES=['indexer'];hydrationFailures.clear();hydratedHashKeys.clear();retrieve(false);});
 function exitToTools(){
  try{sessionStorage.setItem('inj_node_return_tools','1');}catch(_){}
  // Standalone pages normally return to the existing Tools tab without remounting Home.
  if(window.parent!==window){window.parent.postMessage({type:'injnode:section:tools'},location.origin);return;}
  try{
   const source=document.referrer?new URL(document.referrer):null;
   if(source&&source.origin===location.origin&&(source.pathname.endsWith('/')||source.pathname.endsWith('/index.html'))&&history.length>1){history.back();return;}
  }catch(_){}
  location.replace('./index.html?tab=tools');
 }
 $('atBack').addEventListener('click',exitToTools);
 window.addEventListener('pageshow',function(){var next=readSaved();if(next.length!==saved.length){loadWallets();if(current)changeWallet(current);}});
 document.addEventListener('visibilitychange',function(){if(!document.hidden&&current&&!busy&&dataQuality!=='idle')retrieve(false);});
 window.setInterval(function(){if(!document.hidden&&navigator.onLine&&current&&!busy)retrieve(false);},60000);
}
start();
})();
</script>
