<!doctype html><html lang="it" data-inj-tv-display="1"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>INJ Node · TV Display</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:#e6f6f9;background:#030a11;font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.tv-page{height:100dvh;width:100vw;display:grid;grid-template-rows:34px minmax(0,1fr)}
.tv-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#06131b;border-bottom:1px solid #183641;gap:14px;white-space:nowrap}
.tv-head strong{font-size:11px;letter-spacing:.12em}.tv-head span{font-size:10px;color:#93aeb8}.tv-head button{padding:4px 12px;font-size:11px;border:1px solid #345261;background:#132936;color:#e6f6f9;border-radius:6px;cursor:pointer}
.tv-display{width:100%;height:100%;min-height:0;border:0;display:block;background:#040a11}
:fullscreen .tv-page{height:100dvh}
</style>
</head><body><main class="tv-page"><header class="tv-head"><strong>INJ NODE · TV DISPLAY</strong><span>LAYOUT AUTOMATICO · 16:9 / 21:9 / 4K</span><button id="tvFull" type="button">Schermo intero</button></header><iframe class="tv-display" title="Dashboard INJ Node" src="./index.html?external_display=1" allow="fullscreen"></iframe></main>
<script>document.getElementById('tvFull').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();});</script>
</body></html>
