<script defer src="./navigation.js?v=160743"></script><script defer src="./workspace-catalog.js?v=160745"></script><script defer src="./workspace-model.js?v=160745"></script><script defer src="./workspace-values.js?v=160744"></script><script defer src="./workspace-sections.js?v=160745"></script><script defer src="./workspace.js?v=160745"></script>
</head>
<body>
<header class="ws-header"><a href="./index.html" id="workspaceBack" class="ws-home" aria-label="Home">⌂</a><div class="ws-brand"><small>INJ NODE</small><strong>Workspace</strong></div><span id="wsConnection" class="ws-connection">SYNC</span></header>
<nav class="ws-toolbar" aria-label="Workspace"><button id="wsAdd" class="ws-primary"></button><button id="wsPresets"></button><button id="wsEdit"></button><button id="wsSave"></button><button id="wsFull" aria-label="Fullscreen">⛶</button><span id="wsName"></span></nav>
<button id="wsExitFull" class="ws-exit-full" aria-label="Esci da schermo intero" title="Esci da schermo intero" hidden>⛶</button>
<main><div id="wsGrid" class="ws-grid"></div><div id="wsEmpty" class="ws-empty"><span>＋</span><h1></h1><p></p><button id="wsEmptyAdd" class="ws-primary"></button></div></main>
<div class="ws-status" id="wsStatus" role="status" aria-live="polite"></div>
<dialog id="wsCatalog" class="ws-dialog"><header><div><small>INJ NODE / WORKSPACE</small><h2 id="wsCatalogTitle"></h2></div><button data-close aria-label="Close">×</button></header><div class="ws-catalog-controls"><input id="wsSearch" type="search"><label id="wsSourceLabel" for="wsSource"></label><select id="wsSource"></select></div><div id="wsCatalogList"></div></dialog>
<dialog id="wsConfig" class="ws-dialog ws-small"><header><h2 id="wsConfigTitle"></h2><button data-close aria-label="Close">×</button></header><form id="wsConfigForm" class="ws-form"><label><span data-text="title"></span><input name="title" maxlength="60"></label><label><span data-text="source"></span><select name="source"></select></label><div class="ws-form-row"><label><span data-text="width"></span><input name="width" type="number" min="1" max="12" required></label><label><span data-text="height"></span><input name="height" type="number" min="2" max="16" required></label></div><div class="ws-form-row"><label><span data-text="column"></span><input name="column" type="number" min="1" max="12" required></label><label><span data-text="row"></span><input name="row" type="number" min="1" max="10001" required></label></div><label><span data-text="appearance"></span><select name="style"><option value="solid">Solid</option><option value="glass">Glass</option><option value="bare">Minimal</option></select></label><label><span data-text="chartStyle"></span><select name="chartStyle"><option value="line">Linee</option><option value="candles">Candele</option></select></label><label><span data-text="timeframe"></span><select name="timeframe"><option>5m</option><option>15m</option><option>1h</option><option>4h</option><option>24h</option><option>7d</option><option>30d</option></select></label><label><span data-text="goal"></span><select name="goal"><option>0.5</option><option>1</option><option>3</option><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option><option>50</option></select></label><label class="ws-check"><input name="border" type="checkbox"><span data-text="border"></span></label><label class="ws-check"><input name="details" type="checkbox"><span data-text="details"></span></label><button type="submit" class="ws-primary" id="wsApply"></button></form></dialog>
<dialog id="wsPresetDialog" class="ws-dialog ws-small"><header><h2 id="wsPresetTitle">Preset</h2><button data-close aria-label="Close">×</button></header><div id="wsPresetList"></div><div class="ws-preset-actions"><button id="wsNew"></button><button id="wsDuplicatePreset"></button><button id="wsExport"></button><button id="wsImport"></button><input type="file" id="wsFile" accept="application/json,.json" hidden></div><p id="wsStorageNote"></p></dialog>
<dialog id="wsPrompt" class="ws-dialog ws-small"><form id="wsPromptForm" class="ws-form"><header><h2 id="wsPromptTitle"></h2><button type="button" data-close aria-label="Close">×</button></header><input id="wsPromptValue" maxlength="50" required><button type="submit" class="ws-primary" id="wsPromptOK">OK</button></form></dialog>
