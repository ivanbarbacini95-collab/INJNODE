<script id="ws-legacy-badge-cleaner-20261103">
document.addEventListener('DOMContentLoaded',function(){
 var grid=document.getElementById('wsGrid');if(!grid)return;
 var clean=function(){
  grid.querySelectorAll('.ws-card-heading>.ws-pro-data,.ws-card-heading>small')
   .forEach(function(node){node.remove();});
 };
 clean();
 new MutationObserver(clean).observe(grid,{childList:true,subtree:true});
},{once:true});
</script>
