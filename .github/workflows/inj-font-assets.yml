name: INJ Node · bundle open-source webfonts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inj-font-assets.yml'
      - 'scripts/vendor-inj-fonts.py'

permissions:
  contents: write

concurrency:
  group: injnode-vendor-fonts
  cancel-in-progress: false

jobs:
  bundle-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout INJNODE
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WOFF2 tooling
        run: python -m pip install --disable-pip-version-check "fonttools[woff]" brotli
      - name: Generate WOFF2 files with license notices
        run: python scripts/vendor-inj-fonts.py
      - name: Publish font assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/inj-*.woff2 assets/fonts/licenses/OFL-*.txt
          if git diff --cached --quiet; then
            echo "Font binaries already up to date"
            exit 0
          fi
          git commit -m "assets: bundle four SIL-OFL fonts as WOFF2"
          git pull --rebase origin main
          git push origin HEAD:main
