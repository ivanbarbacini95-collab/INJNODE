name: INJ Node · Injective network history
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/inj-network-history.yml'
      - 'scripts/update-inj-network-history.mjs'
      - 'scripts/merge-inj-network-history.mjs'
permissions:
  contents: write
concurrency:
  group: injnode-network-history
  cancel-in-progress: false
jobs:
  network-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture independent Injective mainnet health and QuickNode incidents
        run: node scripts/update-inj-network-history.mjs
      - name: Merge and publish history safely against concurrent GitHub changes
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp)"
          trap 'rm -f "$snapshot"' EXIT
          cp market-data/inj-network-history.json "$snapshot"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --hard origin/main
            node scripts/merge-inj-network-history.mjs "$snapshot" market-data/inj-network-history.json market-data/inj-network-history.json
            git add market-data/inj-network-history.json
            if git diff --cached --quiet; then
              echo "Network history already current."
              exit 0
            fi
            git commit -m "data(network): preserve verified Injective status history"
            if git push origin HEAD:main; then
              echo "Network uptime history saved."
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::Network history push failed after retries"
          exit 1
