<!doctype html>
<html lang="it" data-theme="obsidian" data-inj-page="multi-chart">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script defer src="./page-zoom-lock-20261110.js?v=1"></script>
<meta name="theme-color" content="#060b11">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>INJ Multi Chart · INJ Node</title>
<script>
try{
  const themes=['obsidian','arctic','orbit','classic-black','classic-white'];
  const selected=localStorage.getItem('inj_monitor_theme');
  const theme=themes.includes(selected)?selected:'obsidian';
  document.documentElement.dataset.theme=theme;
  document.documentElement.lang=localStorage.getItem('inj_node_language_v1')==='en'?'en':'it';
  document.documentElement.dataset.injFont=localStorage.getItem('inj_node_font_v1')==='slim'?'slim':'bold';
  document.querySelector('meta[name="theme-color"]').content=
   ({obsidian:'#060b11',arctic:'#f1f7fa',orbit:'#080b1a','classic-black':'#030304','classic-white':'#ffffff'})[theme];
}catch(_){}
</script>
<link rel="stylesheet" href="./multi-chart.css?v=20261110-external-candles1">
<script defer src="./multi-chart.js?v=20261110-external-candles1"></script>
<link rel="stylesheet" href="./inj-rubik-unified-20261110.css?v=rubik-ui1">
</head>
<body>
<div class="mc-app" id="mcApp">
 <header class="mc-header">
  <button id="mcBack" class="mc-icon-button" type="button" aria-label="Torna a Tools" title="Torna a Tools">
   <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
  </button>
  <div class="mc-heading"><strong>INJ MULTI CHART</strong><span>INJ / USDT</span></div>
  <div class="mc-feed" id="mcFeed" aria-live="polite"><i aria-hidden="true"></i><span id="mcFeedText">SYNC</span></div>
 </header>
 <div class="mc-controls">
  <div class="mc-style" role="group" aria-label="Chart style">
   <button id="mcCandles" type="button" class="selected" aria-pressed="true" data-it="Candele" data-en="Candles">Candele</button>
   <button id="mcLines" type="button" aria-pressed="false" data-it="Linee" data-en="Lines">Linee</button>
  </div>
  <output class="mc-quote" id="mcQuote" aria-label="Prezzo live INJ USDT">
   <span id="mcPriceArrow" class="mc-price-arrow" aria-hidden="true"></span>
   <span class="mc-quote-divider" aria-hidden="true"></span>
   <strong id="mcLivePrice">—</strong>
   <span class="mc-quote-badge" id="mcQuoteStatus" data-state="connecting">SYNC</span>
  </output>
  <div class="mc-range-heading" id="mcRangeHeading" aria-live="polite">1m · 5m</div>
 </div>
 <main class="mc-main">
  <div class="mc-rail" id="mcRail" tabindex="0" aria-label="Scorri i gruppi di timeframe">
   <section class="mc-page" id="mcPage0" aria-label="1m 5m"><div class="mc-grid" id="mcGrid0"></div></section>
   <section class="mc-page" id="mcPage1" aria-label="15m 1H"><div class="mc-grid" id="mcGrid1"></div></section>
   <section class="mc-page" id="mcPage2" aria-label="4H 1D"><div class="mc-grid" id="mcGrid2"></div></section>
   <section class="mc-page" id="mcPage3" aria-label="1W 1M"><div class="mc-grid" id="mcGrid3"></div></section>
  </div>
 </main>
 <footer class="mc-footer">
  <button id="mcPrev" class="mc-page-button" type="button" aria-label="Timeframe brevi" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
  <div class="mc-dots" role="group" aria-label="Gruppi timeframe">
   <button type="button" data-page="0" class="active" aria-current="page" aria-label="1m 5m"></button>
   <button type="button" data-page="1" aria-label="15m 1H"></button>
   <button type="button" data-page="2" aria-label="4H 1D"></button>
   <button type="button" data-page="3" aria-label="1W 1M"></button>
  </div>
  <button id="mcNext" class="mc-page-button" type="button" aria-label="Timeframe lunghi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
 </footer>
</div>
<dialog id="mcZoom" class="mc-zoom" aria-label="Grafico ingrandito">
 <div class="mc-zoom-head">
  <div><strong id="mcZoomTitle">INJ / USDT</strong><span id="mcZoomRange"></span></div>
  <button type="button" id="mcZoomClose" class="mc-icon-button" aria-label="Chiudi grafico">×</button>
 </div>
 <div class="mc-zoom-chart"><canvas id="mcZoomCanvas" aria-label="Grafico prezzo ingrandito"></canvas></div>
</dialog>
</body>
</html>
